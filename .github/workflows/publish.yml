name: Build Python Executables

on:
  push:
    tags: ['v*']          
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: windows-x64
          - os: windows-11-arm
            artifact: windows-arm64
          - os: ubuntu-latest
            artifact: linux-x64
          - os: ubuntu-24.04-arm
            artifact: linux-arm64
          - os: macos-26
            artifact: macos-arm64
          - os: macos-26-intel
            artifact: macos-x64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyInstaller
        run: pip install pyinstaller
        
      - name: Build executable
        run: pyinstaller --onefile --clean --name sb3tosb2-${{ matrix.artifact }} sb3tosb2.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/

  release:
    name: Create Single GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write 
    
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-artifacts
          
      - name: Create Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "all-artifacts/**/*"
          tag: ${{ github.ref_name }}
          allowUpdates: true
          generateReleaseNotes: true
